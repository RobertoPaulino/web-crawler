<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Crawler</title>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.3"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Web Crawler</h1>
        
        <div class="crawler-form">
            <form hx-post="/crawl" hx-target="#results" hx-indicator="#spinner">
                <div class="form-group">
                    <input type="url" name="url" id="url" placeholder="Enter URL to crawl..." required>
                </div>
                <div class="form-group controls">
                    <div>
                        <label for="concurrency">Max Concurrency:</label>
                        <input type="number" name="concurrency" id="concurrency" min="1" max="20" value="5">
                    </div>
                    <div>
                        <label for="pages">Max Pages:</label>
                        <input type="number" name="pages" id="pages" min="1" max="1000" value="50">
                    </div>
                </div>
                <button type="submit">Crawl</button>
            </form>
        </div>
        
        <div class="spinner-container">
            <div id="spinner" class="htmx-indicator">
                <div class="spinner"></div>
                <p>Crawling in progress...</p>
            </div>
        </div>
        
        <div id="results" class="results">
            <!-- Results will appear here -->
        </div>
    </div>
</body>
</html>
